<script>
  const firebaseConfig = {
    apiKey: "AIzaSyA7bqByjPq874j6_danx45WK1P772I4dio",
    authDomain: "fusion-dex.firebaseapp.com",
    projectId: "fusion-dex",
    storageBucket: "fusion-dex.firebasestorage.app",
    messagingSenderId: "1053445647677",
    appId: "1:1053445647677:web:45639a98b92bbba52b2954"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let nick = localStorage.getItem("fusionDexNick");
  if (!nick) {
    nick = prompt("Qual é a tua alcunha?") || "Treinador";
    localStorage.setItem("fusionDexNick", nick);
  }

  async function capturarNoFirebase(nomeFusao, headNome, bodyNome) {
    const id = nomeFusao.toLowerCase().replace(/[^a-z0-9]/g, "");
    const ref = db.collection("fusoes").doc(id);
    const doc = await ref.get();
    if (!doc.exists) {
      await ref.set({
        nomeFusao: nomeFusao,
        headNome: headNome,
        bodyNome: bodyNome,
        count: 1,
        capturadores: [nick]
      });
    } else {
      await ref.update({
        count: firebase.firestore.FieldValue.increment(1),
        capturadores: firebase.firestore.FieldValue.arrayUnion(nick)
      });
    }
    alert("Capturado! " + nomeFusao);
  }

  window.mostrarPokedexPartilhada = function(lista) {
  let grid = document.getElementById("firebase-pokedex");
if (!grid) {
  grid = document.createElement("div");
  grid.id = "firebase-pokedex";
  grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px;padding:12px;border:2px solid #22c55e;border-radius:12px";
  const titulo = document.createElement("h3");
  titulo.textContent = "🌐 Pokédex Partilhada";
  titulo.style.color = "white";
  const zona = document.createElement("div");
  zona.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#111827;padding:10px;max-height:320px;overflow:auto;border-bottom:3px solid #22c55e";
  zona.appendChild(titulo);
  zona.appendChild(grid);
  document.body.prepend(zona);
}
  grid.innerHTML = lista.map(f => `
    <div style="border:1px solid #333;padding:12px;border-radius:12px;background:#1a1a2e;color:white">
      <b>${f.nomeFusao}</b><br>
      ${f.headNome} + ${f.bodyNome}<br>
      Capturado ${f.count}x<br>
      Por: ${(f.capturadores || []).join(", ")}
    </div>
  `).join("");
};
    db.collection("fusoes").onSnapshot((snap) => {
    console.log("Pokédex partilhada:", snap.docs.map(d => d.data()));
    if (window.mostrarPokedexPartilhada) {
      window.mostrarPokedexPartilhada(snap.docs.map(d => d.data()));
    }
  });
  // Vigia: se a caixa do Firebase for apagada pelo site antigo, volta a pôr
setInterval(() => {
  const zona = document.getElementById("firebase-pokedex");
  if (!zona) {
    console.log("A caixa sumiu, vou voltar a pôr...");
    db.collection("fusoes").get().then(snap => {
      if (window.mostrarPokedexPartilhada) {
        window.mostrarPokedexPartilhada(snap.docs.map(d => d.data()));
      }
    });
  }
}, 2000);
</script>
